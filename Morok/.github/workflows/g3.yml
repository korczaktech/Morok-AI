name: G3

on:
  push:
    branches: [main]
    paths:
      - "Gerações/G3/**"
      - "MODELOS.md"
      - ".github/workflows/g3.yml"
  pull_request:
    paths:
      - "Gerações/G3/**"
      - "MODELOS.md"
      - ".github/workflows/g3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g3-structure-and-isolation:
    name: Validate reserved G3 structure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate G3 profile reservations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("Gerações/G3")
          profiles = ("Mokosh", "Tsukuyomi", "Artemis", "Apollo")
          errors = []

          if not (root / "README.md").is_file():
              errors.append("Gerações/G3/README.md is missing")

          for profile in profiles:
              readme = root / profile / "README.md"
              if not readme.is_file():
                  errors.append(f"{readme} is missing")

          source_files = [
              path for path in root.rglob("*")
              if path.is_file() and path.suffix in {".c", ".cc", ".cpp", ".cxx", ".h", ".hh", ".hpp", ".hxx"}
          ]
          forbidden = re.compile(r"morok::g[12]::|morok/g[12]/|G[12]/")
          for path in source_files:
              if forbidden.search(path.read_text(encoding="utf-8")):
                  errors.append(f"{path} imports or references a private Gerações/G1/G2 API")

          if errors:
              print("\n".join(f"- {error}" for error in errors), file=sys.stderr)
              raise SystemExit(1)

          print("G3 reservation and generation-isolation checks passed.")
          print("No G3 executable engine is claimed by this workflow.")
          PY
