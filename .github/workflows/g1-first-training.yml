name: G1 First Complete Training

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/g1-first-training.yml"
      - "G1/scripts/first-training.sh"
      - "G1/apps/train.cpp"
      - "G1/apps/generate.cpp"
      - "src/model/learn/**"
      - "include/morok/model/learn/**"
      - "include/morok/model/parameters/**"
      - "G1/shared/tests/fixtures/benchmark/**"
      - "G1/shared/tests/acceptance/**"
      - "tests/CMakeLists.txt"
      - "CMakeLists.txt"
  workflow_dispatch:
    inputs:
      epochs:
        description: "Maximum training epochs"
        required: true
        default: "50"
        type: string
      seed:
        description: "Deterministic initialization and split seed"
        required: true
        default: "42"
        type: string

permissions:
  contents: read

jobs:
  first-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMOROK_BUILD_TESTS=ON -DMOROK_BUILD_APPS=ON -DMOROK_BUILD_G2=OFF

      - name: Build all applications and tests
        run: cmake --build build --parallel 2

      - name: Run complete CTest suite
        run: ctest --test-dir build --output-on-failure

      - name: Execute first complete G1 training, resume and inference
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash G1/scripts/first-training.sh \
            artifacts/training/stage20 \
            "${{ github.event.inputs.epochs || '50' }}" \
            "${{ github.event.inputs.seed || '42' }}"

      - name: Publish training evidence
        uses: actions/upload-artifact@v4
        with:
          name: morok-g1-first-training-${{ github.run_id }}
          path: artifacts/training/stage20/
          if-no-files-found: error
          retention-days: 90
