name: G2 First Complete Training
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Maximum training epochs per expert"
        required: true
        default: "10"
        type: string
      seed:
        description: "Deterministic corpus split and initialization seed"
        required: true
        default: "42"
        type: string
permissions:
  contents: read
jobs:
  first-training:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev
      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMOROK_BUILD_TESTS=ON -DMOROK_BUILD_APPS=ON
      - name: Build all applications and tests
        run: cmake --build build --parallel 2
      - name: Run complete CTest suite
        run: ctest --test-dir build --output-on-failure
      - name: Train both G2 experts, resume, and generate
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash scripts/run-g2-first-training.sh \
            artifacts/training/g2 \
            "${{ github.event.inputs.epochs || '10' }}" \
            "${{ github.event.inputs.seed || '42' }}"
      - name: Publish G2 training evidence
        uses: actions/upload-artifact@v4
        with:
          name: morok-g2-first-training-${{ github.run_id }}
          path: artifacts/training/g2/
          if-no-files-found: error
          retention-days: 90
