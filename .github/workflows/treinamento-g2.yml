name: Treinamento — G2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tsukuyomi:
        description: "Treinar o Tsukuyomi"
        type: boolean
        required: true
        default: true
      epocas:
        description: "Épocas por tentativa (passagens completas pelo corpus)"
        type: number
        required: true
        default: 20
      tentativas:
        description: "Número máximo de ciclos de treinamento"
        type: number
        required: true
        default: 10
      questoes:
        description: "Quantidade de perguntas de validação (1 a 40)"
        type: number
        required: true
        default: 40
      learning_rate:
        description: "Learning rate inicial (maior que 0 e até 0.1; padrão: 0.001)"
        type: number
        required: true
        default: 0.001
      treinamento_continuo:
        description: "Parar antecipadamente se todas as perguntas estiverem corretas (limite de tentativas permanece ativo)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: treinamento-g2-persistent-state
  cancel-in-progress: false

jobs:
  tsukuyomi:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar parâmetros
        env:
          EPOCAS: ${{ github.event_name == 'push' && 20 || inputs.epocas || 20 }}
          TENTATIVAS: ${{ github.event_name == 'push' && 10 || inputs.tentativas || 10 }}
          QUESTOES: ${{ github.event_name == 'push' && 40 || inputs.questoes || 40 }}
          LEARNING_RATE: ${{ github.event_name == 'push' && '0.001' || inputs.learning_rate || '0.001' }}
        run: |
          python3 - <<'PY'
          import os
          epocas = int(os.environ["EPOCAS"])
          tentativas = int(os.environ["TENTATIVAS"])
          if not 1 <= epocas <= 100:
              raise SystemExit("EPOCAS precisa estar entre 1 e 100.")
          if not 1 <= tentativas <= 10:
              raise SystemExit("TENTATIVAS precisa estar entre 1 e 10.")
          if epocas * tentativas > 200:
              raise SystemExit("O treinamento está limitado a 200 épocas totais por execução.")
          questoes = int(os.environ["QUESTOES"])
          if not 1 <= questoes <= 40:
              raise SystemExit("QUESTOES precisa estar entre 1 e 40.")
          learning_rate = float(os.environ["LEARNING_RATE"])
          import math
          if not math.isfinite(learning_rate) or not 0.0 < learning_rate <= 0.1:
              raise SystemExit("LEARNING_RATE precisa estar entre 0 e 0.1.")
          PY

      - name: Validar conjuntos e avaliador
        working-directory: Morok
        run: python3 -m unittest discover -s "Gerações/G2/Tsukuyomi/tests" -p "test_*.py" -v

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configurar
        working-directory: Morok
        run: >-
          cmake -S . -B build/g2 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Compilar Tsukuyomi G2
        working-directory: Morok
        run: >-
          cmake --build build/g2 --parallel 2
          --target morok_g2_tsukuyomi
          morok_g2_tsukuyomi_train
          morok_g2_tsukuyomi_generate
          morok_test_g2_tsukuyomi

      - name: Testar Tsukuyomi G2
        working-directory: Morok
        run: ctest --test-dir build/g2 -R "g2.tsukuyomi.model|architecture.generation_isolation" --output-on-failure

      - name: Recuperar memória persistente do Tsukuyomi
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[train-g2]')) || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi) }}
        run: |
          mkdir -p Morok/build/g2
          if git fetch origin refs/heads/tsukuyomi-state:refs/remotes/origin/tsukuyomi-state 2>/dev/null; then
            git show origin/tsukuyomi-state:state/tsukuyomi-g2.ckpt > Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt
            git show origin/tsukuyomi-state:state/tsukuyomi-g2.ckpt.adam > Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt.adam
            test -s Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt
            test -s Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt.adam
            echo "Memória persistente recuperada: pesos + estado Adam."
          else
            echo "Primeira execução: ainda não existe memória persistente."
          fi

      - name: Treinar e avaliar somente as questões selecionadas
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[train-g2]')) || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi) }}
        working-directory: Morok
        env:
          EPOCAS: ${{ inputs.epocas || 20 }}
          TENTATIVAS: ${{ inputs.tentativas || 10 }}
          QUESTOES: ${{ inputs.questoes || 40 }}
          TSUKUYOMI_LEARNING_RATE: ${{ inputs.learning_rate || '0.001' }}
          TREINAMENTO_CONTINUO: ${{ github.event_name == 'workflow_dispatch' && inputs.treinamento_continuo || false }}
        run: |
          CONTINUO=0
          if [ "$TREINAMENTO_CONTINUO" = "true" ]; then CONTINUO=1; fi
          python3 "Gerações/G2/Tsukuyomi/scripts/treinamento_ciclico.py" \
            build/g2/morok-g2-tsukuyomi-train \
            build/g2/morok-g2-tsukuyomi-generate \
            "Gerações/G2/Tsukuyomi/data/treinamento.txt" \
            "Gerações/G2/Tsukuyomi/data/validacao.txt" \
            "Gerações/G2/Tsukuyomi/data/teste.txt" \
            "$EPOCAS" "$TENTATIVAS" "$CONTINUO" "$QUESTOES"

      - name: Avaliação final independente do checkpoint vencedor
        if: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[train-g2]')) || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi)) && (github.event_name == 'push' || inputs.questoes != 1) }}
        working-directory: Morok
        run: |
          python3 "Gerações/G2/Tsukuyomi/scripts/avaliacao_final.py" \
            build/g2/morok-g2-tsukuyomi-generate \
            build/g2/tsukuyomi-treinamento-ciclico.ckpt \
            "Gerações/G2/Tsukuyomi/data/validacao.txt" \
            "Gerações/G2/Tsukuyomi/data/teste.txt" \
            build/g2/avaliacao-final-tsukuyomi.json

      - name: Persistir pesos e memória de treinamento
        if: ${{ success() && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[train-g2]')) || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi)) }}
        working-directory: Morok
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/tsukuyomi-state"
          if git -C "$GITHUB_WORKSPACE" fetch origin refs/heads/tsukuyomi-state:refs/remotes/origin/tsukuyomi-state 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" worktree add -B tsukuyomi-state "$STATE_DIR" origin/tsukuyomi-state
          else
            git -C "$GITHUB_WORKSPACE" worktree add -b tsukuyomi-state "$STATE_DIR" HEAD
            git -C "$STATE_DIR" rm -rf .
          fi
          mkdir -p "$STATE_DIR/state"
          install -m 0644 build/g2/tsukuyomi-treinamento-ciclico.ckpt "$STATE_DIR/state/tsukuyomi-g2.ckpt"
          install -m 0644 build/g2/tsukuyomi-treinamento-ciclico.ckpt.adam "$STATE_DIR/state/tsukuyomi-g2.ckpt.adam"
          cat > "$STATE_DIR/state/README.txt" <<'EOF'
          Tsukuyomi G2 persistent training state.
          Keep the .ckpt and .adam files together; both are required for exact optimizer continuation.
          This branch is machine state, not source code. Do not merge it into main.
          EOF
          git -C "$STATE_DIR" add state/
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "O estado persistente não mudou; nenhuma gravação necessária."
          else
            git -C "$STATE_DIR" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Persistir estado de treinamento Tsukuyomi G2"
            git -C "$STATE_DIR" push origin tsukuyomi-state
          fi

      - name: Publicar tabela de respostas e annotations G2
        if: always()
        working-directory: Morok
        run: |
          if [ -f build/g2/respostas-tsukuyomi.md ]; then
            cat build/g2/respostas-tsukuyomi.md | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de avaliação não encontrado." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar checkpoint e respostas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsukuyomi-g2-treinamento-${{ github.run_id }}
          path: |
            Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt
            Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt.adam
            Morok/build/g2/respostas-tsukuyomi.md
            Morok/build/g2/avaliacao-final-tsukuyomi.json
            Morok/build/g2/avaliacao-final-tsukuyomi.md
          if-no-files-found: warn
          retention-days: 30

  nenhum-modelo-selecionado:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.tsukuyomi }}
    runs-on: ubuntu-24.04
    steps:
      - name: Informar seleção vazia
        run: echo "Nenhum modelo G2 foi selecionado para treinamento."
