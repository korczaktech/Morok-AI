name: Treinamento — G2

on:
  workflow_dispatch:
    inputs:
      tsukuyomi:
        description: "Treinar o Tsukuyomi"
        type: boolean
        required: true
        default: true
      epocas:
        description: "Épocas por ciclo (passagens completas pelo corpus)"
        type: number
        required: true
        default: 10
      tentativas:
        description: "Ciclos de resposta (cada ciclo responde a todas as perguntas)"
        type: number
        required: true
        default: 1

permissions:
  contents: read

concurrency:
  group: treinamento-g2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  tsukuyomi:
    if: ${{ inputs.tsukuyomi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar parâmetros
        env:
          EPOCAS: ${{ inputs.epocas }}
          TENTATIVAS: ${{ inputs.tentativas }}
        run: |
          python3 - <<'PY'
          import os
          for name in ("EPOCAS", "TENTATIVAS"):
              value = int(os.environ[name])
              if value < 1:
                  raise SystemExit(f"{name} precisa ser maior que zero.")
          PY

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configurar
        working-directory: Morok
        run: >-
          cmake -S . -B build/g2 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Compilar Tsukuyomi G2
        working-directory: Morok
        run: >-
          cmake --build build/g2 --parallel 2
          --target morok_g2_tsukuyomi
          morok_g2_tsukuyomi_train
          morok_g2_tsukuyomi_generate
          morok_test_g2_tsukuyomi

      - name: Testar Tsukuyomi G2
        working-directory: Morok
        run: ctest --test-dir build/g2 -R "g2.tsukuyomi.model|architecture.generation_isolation" --output-on-failure

      - name: Executar treinamento cíclico e responder todas as perguntas
        working-directory: Morok
        env:
          EPOCAS: ${{ inputs.epocas }}
          TENTATIVAS: ${{ inputs.tentativas }}
        run: |
          python3 "Gerações/G2/Tsukuyomi/scripts/treinamento_ciclico.py" \
            build/g2/morok-g2-tsukuyomi-train \
            build/g2/morok-g2-tsukuyomi-generate \
            "Gerações/G2/Tsukuyomi/data/treinamento-inicial.txt" \
            "$EPOCAS" "$TENTATIVAS"

      - name: Publicar tabela de respostas e annotations G2
        if: always()
        working-directory: Morok
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          report = Path("build/g2/respostas-tsukuyomi.md")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          def table(headers, rows):
              lines = ["| " + " | ".join(headers) + " |",
                       "| " + " | ".join("---" for _ in headers) + " |"]
              for row in rows:
                  cells = [str(cell).replace("|", "\|").replace("\r", " ").replace("\n", " ") for cell in row]
                  lines.append("| " + " | ".join(cells) + " |")
              return "\n".join(lines) + "\n"

          if not report.is_file():
              message = "O relatório de respostas não foi produzido; verifique o treinamento cíclico."
              print(f"::error title=Tsukuyomi G2::{message}")
              rendered = "# Treinamento G2 — respostas e annotations\n\n" + message + "\n"
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write(rendered)
              raise SystemExit(0)

          content = report.read_text(encoding="utf-8")
          questions = []
          current = None
          for line in content.splitlines():
              if line.startswith("### "):
                  if current is not None:
                      questions.append(current)
                  match = re.match(r"###\s+(\d+)\.\s+(.*)", line)
                  current = {"number": match.group(1) if match else "?", "question": match.group(2) if match else line[4:], "answer": ""}
              elif current is not None and line.strip() and not line.startswith("#"):
                  current["answer"] = (current["answer"] + " " + line.strip()).strip()
          if current is not None:
              questions.append(current)

          cycle = 0
          for line in content.splitlines():
              match = re.match(r"## Tentativa (\d+)", line)
              if match:
                  cycle = int(match.group(1))
                  # Cada tentativa é marcada na própria tabela via cabeçalho.
          cycles = int(re.search(r"Ciclos/tentativas: (\d+)", content).group(1)) if re.search(r"Ciclos/tentativas: (\d+)", content) else 0
          expected = len(questions)
          generated = sum(bool(item["answer"]) for item in questions)
          empty = expected - generated

          rows = []
          for item in questions:
              answer = item["answer"] or "(nenhuma saída gerada)"
              visible = answer if len(answer) <= 160 else answer[:157] + "..."
              rows.append([item["number"], item["question"], visible, "Gerada — não avaliada"])
              safe = visible.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
              level = "notice" if item["answer"] else "warning"
              print(f"::{level} title=Tsukuyomi G2::Pergunta {item['number']}: {item['question']}; resposta: {safe}; avaliação semântica: pendente")

          rendered = [
              "# Treinamento G2 — respostas e annotations", "",
              f"Ciclos configurados: {cycles}. Perguntas registradas: {expected}. Respostas não vazias: {generated}. Saídas vazias: {empty}.", "",
              "As respostas são saídas reais da inferência do modelo. Ainda não existe avaliador semântico nesta versão; portanto, nenhuma resposta é marcada como correta ou incorreta.", "",
              table(["Nº", "Pergunta", "Resposta gerada", "Avaliação"], rows)
          ]
          text = "\n".join(rendered) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(text)
          print(text)
          PY

      - name: Publicar checkpoint e respostas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsukuyomi-g2-treinamento-${{ github.run_id }}
          path: |
            Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt
            Morok/build/g2/respostas-tsukuyomi.md
          if-no-files-found: warn
          retention-days: 30

  nenhum-modelo-selecionado:
    if: ${{ !inputs.tsukuyomi }}
    runs-on: ubuntu-24.04
    steps:
      - name: Informar seleção vazia
        run: echo "Nenhum modelo G2 foi selecionado para treinamento."
