name: Treinamento — G2
# [train-g2] Execução solicitada: 50 épocas, 100 tentativas, modo contínuo desativado

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tsukuyomi:
        description: "Treinar o Tsukuyomi"
        type: boolean
        required: true
        default: true
      epocas:
        description: "Máximo de épocas por tentativa (passagens completas pelo corpus)"
        type: number
        required: true
        default: 50
      tentativas:
        description: "Número máximo de ciclos de treinamento"
        type: number
        required: true
        default: 100
      treinamento_continuo:
        description: "Parar antecipadamente se todas as perguntas estiverem corretas (limite de tentativas permanece ativo)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: treinamento-g2-persistent-state
  cancel-in-progress: false

jobs:
  tsukuyomi:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar parâmetros
        env:
          EPOCAS: ${{ github.event_name == 'push' && 50 || inputs.epocas || 50 }}
          TENTATIVAS: ${{ github.event_name == 'push' && 100 || inputs.tentativas || 100 }}
        run: |
          python3 - <<'PY'
          import os
          epocas = int(os.environ["EPOCAS"])
          tentativas = int(os.environ["TENTATIVAS"])
          if not 1 <= epocas <= 1000:
              raise SystemExit("EPOCAS precisa estar entre 1 e 1000.")
          if not 1 <= tentativas <= 100:
              raise SystemExit("TENTATIVAS precisa estar entre 1 e 100.")
          PY

      - name: Validar corpus de 40 perguntas e testes
        working-directory: Morok
        run: python3 -m unittest discover -s "Gerações/G2/Tsukuyomi/tests" -p "test_*.py" -v

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configurar
        working-directory: Morok
        run: >-
          cmake -S . -B build/g2 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Compilar Tsukuyomi G2
        working-directory: Morok
        run: >-
          cmake --build build/g2 --parallel 2
          --target morok_g2_tsukuyomi
          morok_g2_tsukuyomi_train
          morok_g2_tsukuyomi_generate
          morok_test_g2_tsukuyomi

      - name: Testar Tsukuyomi G2
        working-directory: Morok
        run: ctest --test-dir build/g2 -R "g2.tsukuyomi.model|architecture.generation_isolation" --output-on-failure

      - name: Recuperar memória persistente do Tsukuyomi
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[train-g2]')) || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi) }}
        run: |
          mkdir -p Morok/build/g2
          if git fetch origin refs/heads/tsukuyomi-state:refs/remotes/origin/tsukuyomi-state 2>/dev/null; then
            git show origin/tsukuyomi-state:state/tsukuyomi-g2.ckpt > Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt
            git show origin/tsukuyomi-state:state/tsukuyomi-g2.ckpt.adam > Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt.adam
            if git cat-file -e origin/tsukuyomi-state:state/tsukuyomi-g2-feedback.txt 2>/dev/null; then
              git show origin/tsukuyomi-state:state/tsukuyomi-g2-feedback.txt > Morok/build/g2/tsukuyomi-memoria-erros.txt
            else
              : > Morok/build/g2/tsukuyomi-memoria-erros.txt
            fi
            if git cat-file -e origin/tsukuyomi-state:state/tsukuyomi-g2-question-history.json 2>/dev/null; then
              git show origin/tsukuyomi-state:state/tsukuyomi-g2-question-history.json > Morok/build/g2/tsukuyomi-historico-perguntas.json
            fi
            test -s Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt
            test -s Morok/build/g2/tsukuyomi-treinamento-ciclico.ckpt.adam
            if git cat-file -e origin/tsukuyomi-state:state/tsukuyomi-g2-questions 2>/dev/null; then
              git archive origin/tsukuyomi-state state/tsukuyomi-g2-questions | tar -x -C "$RUNNER_TEMP"
              mkdir -p Morok/build/g2/tsukuyomi-questoes
              cp -a "$RUNNER_TEMP/state/tsukuyomi-g2-questions/." Morok/build/g2/tsukuyomi-questoes/
              echo "40 checkpoints individuais e seus estados Adam recuperados."
            fi
            echo "Memória persistente recuperada: estados e memória."
          else
            echo "Primeira execução: ainda não existe memória persistente."
          fi

      - name: Treinar as 40 perguntas
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[train-g2]')) || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi) }}
        working-directory: Morok
        env:
          EPOCAS: ${{ github.event_name == 'push' && 50 || inputs.epocas || 50 }}
          TENTATIVAS: ${{ github.event_name == 'push' && 100 || inputs.tentativas || 100 }}
          TREINAMENTO_CONTINUO: ${{ github.event_name == 'workflow_dispatch' && inputs.treinamento_continuo || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTINUO=0
          if [ "$TREINAMENTO_CONTINUO" = "true" ]; then CONTINUO=1; fi
          python3 "Gerações/G2/Tsukuyomi/scripts/treinamento_ciclico.py" \
            build/g2/morok-g2-tsukuyomi-train \
            build/g2/morok-g2-tsukuyomi-generate \
            "Gerações/G2/Tsukuyomi/data/feedback.txt" \
            "$EPOCAS" "$TENTATIVAS" "$CONTINUO"

      - name: Persistir pesos e memória de treinamento
        if: ${{ success() && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[train-g2]')) || (github.event_name == 'workflow_dispatch' && inputs.tsukuyomi)) }}
        working-directory: Morok
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/tsukuyomi-state"
          if git -C "$GITHUB_WORKSPACE" fetch origin refs/heads/tsukuyomi-state:refs/remotes/origin/tsukuyomi-state 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" worktree add -B tsukuyomi-state "$STATE_DIR" origin/tsukuyomi-state
          else
            git -C "$GITHUB_WORKSPACE" worktree add -b tsukuyomi-state "$STATE_DIR" HEAD
            git -C "$STATE_DIR" rm -rf .
          fi
          mkdir -p "$STATE_DIR/state"
          test -d build/g2/tsukuyomi-questoes
          rm -rf "$STATE_DIR/state/tsukuyomi-g2-questions"
          mkdir -p "$STATE_DIR/state/tsukuyomi-g2-questions"
          cp -a build/g2/tsukuyomi-questoes/. "$STATE_DIR/state/tsukuyomi-g2-questions/"
          rm -f "$STATE_DIR/state/tsukuyomi-g2.ckpt" "$STATE_DIR/state/tsukuyomi-g2.ckpt.adam"
          if [ -f build/g2/tsukuyomi-memoria-erros.txt ]; then
            install -m 0644 build/g2/tsukuyomi-memoria-erros.txt "$STATE_DIR/state/tsukuyomi-g2-feedback.txt"
          else
            : > "$STATE_DIR/state/tsukuyomi-g2-feedback.txt"
          fi
          test -s build/g2/tsukuyomi-historico-perguntas.json
          rm -f "$STATE_DIR/state/tsukuyomi-g2-learning-rate.txt"
          install -m 0644 build/g2/tsukuyomi-historico-perguntas.json "$STATE_DIR/state/tsukuyomi-g2-question-history.json"
          cat > "$STATE_DIR/state/README.txt" <<'EOF'
          Tsukuyomi G2 persistent training state.
          Each question has its own .ckpt and matching .ckpt.adam file; never mix or separate these pairs.
          This branch is machine state, not source code. Do not merge it into main.
          EOF
          git -C "$STATE_DIR" add state/
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "O estado persistente não mudou; nenhuma gravação necessária."
          else
            git -C "$STATE_DIR" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Persistir estado de treinamento Tsukuyomi G2"
            git -C "$STATE_DIR" push origin tsukuyomi-state
          fi

      - name: Publicar relatório individual das 40 perguntas — vermelho/verde
        if: always()
        working-directory: Morok
        run: |
          if [ -f build/g2/respostas-tsukuyomi.md ]; then
            {
              echo "## Annotations — Tsukuyomi G2"
              echo
              echo "<details>"
              echo "<summary>Expandir os 40 resultados individuais: resposta, nível lexical, Loss, BPB e demais métricas</summary>"
              echo
              cat build/g2/respostas-tsukuyomi.md
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de avaliação não encontrado." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar checkpoint e respostas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsukuyomi-g2-treinamento-${{ github.run_id }}
          path: |
            Morok/build/g2/tsukuyomi-questoes/
            Morok/build/g2/tsukuyomi-memoria-erros.txt
            Morok/build/g2/tsukuyomi-historico-perguntas.json
            Morok/build/g2/tsukuyomi-learning-rates-by-question.txt
            Morok/build/g2/respostas-tsukuyomi.md
          if-no-files-found: warn
          retention-days: 30

  nenhum-modelo-selecionado:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.tsukuyomi }}
    runs-on: ubuntu-24.04
    steps:
      - name: Informar seleção vazia
        run: echo "Nenhum modelo G2 foi selecionado para treinamento."
