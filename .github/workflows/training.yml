name: training

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/training.yml"
      - "scripts/run-g1-continual-cycle.sh"
      - "scripts/evaluate-g1-qa.py"
      - "tests/fixtures/continual/**"
      - "tests/fixtures/continual-eval/**"
      - "docs/53-aprendizagem-continua-g1-actions.md"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "tests/**"
      - "apps/**"
      - "include/morok/model/learn/**"
      - "src/model/learn/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: morok-g1-training
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  continual-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state from the latest successful cycle
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/continual-g1
          previous_run="$(gh run list \
            --workflow training.yml \
            --branch main \
            --status success \
            --json databaseId \
            --limit 1 \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$previous_run" ]]; then
            previous_run="$(gh run list \
              --workflow g1-continual-learning.yml \
              --branch main \
              --status success \
              --json databaseId \
              --limit 1 \
              --jq '.[0].databaseId // empty')"
          fi
          if [[ -n "$previous_run" ]]; then
            echo "Restoring state from successful run $previous_run"
            gh run download "$previous_run" \
              --name morok-g1-continual-state \
              --dir artifacts/continual-g1
          else
            echo "No previous successful cycle; starting from deterministic initialization."
          fi

          # Ignore legacy lexical goal markers: they did not prove semantic learning.
          rm -f artifacts/continual-g1/goal-reached.txt
          expected_arch="RLAH-G1-fastslow-d11-bit8-eos"
          current_corpus_sha="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          digest = hashlib.sha256()
          for path in sorted(Path("tests/fixtures/continual").glob("doc-*.txt")):
              digest.update(path.name.encode("utf-8"))
              digest.update(path.read_bytes())
          print(digest.hexdigest())
          PY
          )"
          stored_arch="$(python3 - artifacts/continual-g1/status.json <<'PY'
          import json
          import sys
          from pathlib import Path
          try:
              print(json.loads(Path(sys.argv[1]).read_text()).get("architecture_id", ""))
          except (OSError, ValueError):
              print("")
          PY
          )"
          stored_corpus_sha="$(python3 - artifacts/continual-g1/status.json <<'PY'
          import json
          import sys
          from pathlib import Path
          try:
              print(json.loads(Path(sys.argv[1]).read_text()).get("corpus_sha256", ""))
          except (OSError, ValueError):
              print("")
          PY
          )"
          current_corpus_documents="$(find tests/fixtures/continual -maxdepth 1 -type f -name 'doc-*.txt' | wc -l | tr -d ' ')"
          stored_corpus_documents="$(python3 - artifacts/continual-g1/status.json <<'PY'
          import json
          import sys
          from pathlib import Path
          try:
              print(json.loads(Path(sys.argv[1]).read_text()).get("corpus_documents", 0))
          except (OSError, ValueError):
              print(0)
          PY
          )"
          stored_manifest_version="$(python3 - artifacts/continual-g1/status.json <<'PY'
          import json
          import sys
          from pathlib import Path
          try:
              print(json.loads(Path(sys.argv[1]).read_text()).get("corpus_manifest_version", 0))
          except (OSError, ValueError):
              print(0)
          PY
          )"
          compatible=true
          if [[ "$stored_arch" != "$expected_arch" || "$stored_corpus_sha" != "$current_corpus_sha" || "$stored_corpus_documents" != "$current_corpus_documents" || "$stored_manifest_version" != "2" ]]; then
            echo "Discarding incompatible architecture/corpus state."
            rm -f artifacts/continual-g1/*
            compatible=false
          fi

          if [[ "$compatible" == "true" ]] && grep -q '"status": "budget_exhausted"' artifacts/continual-g1/status.json 2>/dev/null; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "A compatible terminal state was restored; scheduled cycles will do no more training."
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.restore.outputs.stop != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev

      - name: Configure Release
        if: steps.restore.outputs.stop != 'true'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMOROK_BUILD_TESTS=ON -DMOROK_BUILD_APPS=ON

      - name: Build
        if: steps.restore.outputs.stop != 'true'
        run: cmake --build build --parallel 2

      - name: Run tests
        if: steps.restore.outputs.stop != 'true'
        run: ctest --test-dir build --output-on-failure

      - name: Train, evaluate target and save resumable state
        if: steps.restore.outputs.stop != 'true'
        env:
          MOROK_EPOCHS_PER_CYCLE: "10"
          MOROK_MAX_TOTAL_EPOCHS: "500"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/run-g1-continual-cycle.sh artifacts/continual-g1

      - name: Publish resumable state and evaluation
        if: always() && steps.restore.outputs.stop != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: morok-g1-continual-state
          path: artifacts/continual-g1/
          if-no-files-found: warn
          retention-days: 90

      - name: Display generated response
        if: always()
        shell: bash
        run: |
          generated="artifacts/continual-g1/generated.txt"
          if [[ ! -f "$generated" ]]; then
            echo "::error::generated.txt was not found; there is no generated response to display."
            exit 1
          fi
          cat "$generated"
