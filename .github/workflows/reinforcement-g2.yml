name: Reinforcement-G2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reinforcement-g2.yml"
      - "apps/reinforce_g2.cpp"
      - "apps/generate_g2.cpp"
      - "src/model/learn/g1_training.cpp"
      - "src/model/learn/g2_training.cpp"
      - "include/morok/model/learn/g1_training.hpp"
      - "tests/unit/model/test_g2.cpp"
      - "tests/fixtures/g2-single-document/**"
      - "scripts/run-g2-reinforcement.py"
      - "tests/unit/model/test_g2_reinforcement.cpp"
      - "tests/scripts/test_g2_reinforcement.py"
      - "docs/56-aprendizado-por-reforco-g2.md"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
  workflow_dispatch:
    inputs:
      question_sky:
        description: "Pergunta: O céu é azul?"
        required: true
        type: boolean
        default: true
      question_mountains:
        description: "Pergunta: As montanhas são altas ou baixas?"
        required: true
        type: boolean
        default: true
      question_grass:
        description: "Pergunta: Que cor é a grama?"
        required: true
        type: boolean
        default: true
      attempts:
        description: "Number of G2 answer attempts (1-10)"
        required: true
        type: number
        default: 3
      epochs:
        description: "Bootstrap epochs per expert"
        required: true
        type: number
        default: 10000
permissions:
  contents: write
  actions: read
concurrency:
  group: morok-g2-reinforcement
  cancel-in-progress: false
jobs:
  reinforcement-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore previous G2 reinforcement checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh run list --workflow reinforcement-g2.yml --limit 20 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)"
          if [[ -n "$previous_run" ]]; then
            mkdir -p artifacts/reinforcement-g2
            gh run download "$previous_run" --name morok-g2-reinforcement-state-v3 --dir artifacts/reinforcement-g2
            if [[ ! -f artifacts/reinforcement-g2/model.v2.expert-a || ! -f artifacts/reinforcement-g2/model.v2.expert-b ]]; then
              echo "::error::Previous G2 artifact does not contain both expert checkpoints."
              exit 1
            fi
            echo "Restored G2 checkpoints from workflow run $previous_run."
          else
            echo "No successful previous G2 run found; bootstrap will initialize both experts."
          fi
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev python3
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMOROK_BUILD_TESTS=ON -DMOROK_BUILD_APPS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Run G2 reinforcement
        env:
          QUESTION_SKY: ${{ github.event_name != 'workflow_dispatch' || inputs.question_sky }}
          QUESTION_MOUNTAINS: ${{ github.event_name != 'workflow_dispatch' || inputs.question_mountains }}
          QUESTION_GRASS: ${{ github.event_name != 'workflow_dispatch' || inputs.question_grass }}
        run: |
          mkdir -p artifacts/reinforcement-g2
          questions=()
          [[ "$QUESTION_SKY" == "true" ]] && questions+=(sky_is_blue)
          [[ "$QUESTION_MOUNTAINS" == "true" ]] && questions+=(mountains_high_or_low)
          [[ "$QUESTION_GRASS" == "true" ]] && questions+=(grass_color)
          if [[ "${#questions[@]}" -eq 0 ]]; then
            echo "::error::Select at least one question."
            exit 1
          fi
          python3 scripts/run-g2-reinforcement.py \
            --checkpoint artifacts/reinforcement-g2/model \
            --database data/reinforcement-g2/answers.json \
            --questions "${questions[@]}" \
            --attempts "${{ github.event_name == 'workflow_dispatch' && inputs.attempts || 3 }}" \
            --bootstrap-epochs "${{ github.event_name == 'workflow_dispatch' && inputs.epochs || 10000 }}" \
            --results-file artifacts/reinforcement-g2/attempt-results.txt
      - name: Commit G2 feedback history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reinforcement-g2/answers.json
          if ! git diff --cached --quiet; then
            git commit -m "Record G2 reinforcement answers and rewards"
            git fetch origin main && git rebase origin/main && git push origin HEAD:main
          fi
      - name: Publish G2 reinforcement state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morok-g2-reinforcement-state-v3
          path: artifacts/reinforcement-g2/
          if-no-files-found: warn
          retention-days: 90
      - name: Display attempt results
        if: always()
        run: |
          if [[ -f artifacts/reinforcement-g2/attempt-results.txt ]]; then cat artifacts/reinforcement-g2/attempt-results.txt; else echo "No G2 attempt results were produced."; fi
