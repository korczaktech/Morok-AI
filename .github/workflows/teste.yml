name: teste

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Mensagem que será testada"
        type: choice
        required: true
        default: sky_is_blue
        options:
          - sky_is_blue
          - grass_color
          - mountains_high_or_low
          - greeting
          - english_sky
          - spanish_sky
          - multi_turn
      model_tsukuyomi:
        description: "Tsukuyomi"
        type: boolean
        required: true
        default: false
      model_apollo:
        description: "Apollo"
        type: boolean
        required: true
        default: false
      model_mokosh:
        description: "Mokosh"
        type: boolean
        required: true
        default: false
      model_tsukuyomi_max:
        description: "Tsukuyomi Max"
        type: boolean
        required: true
        default: true
      previous_run_id:
        description: "Uso interno para continuar o treinamento"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: morok-g1-teste
  cancel-in-progress: false

jobs:
  train-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      continue: ${{ steps.loop.outputs.continue }}
      success: ${{ steps.loop.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous model states
        if: inputs.previous_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: morok-g1-teste-state
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}
          path: Morok/test-state

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configure G1
        working-directory: Morok
        run: >-
          cmake -S . -B build/g1 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=OFF
          -DMOROK_BUILD_APPS=ON

      - name: Build G1
        working-directory: Morok
        run: cmake --build build/g1 --parallel 2

      - name: Validate semantic response evaluator
        working-directory: Morok
        run: build/g1/morok-g1-profile-evaluate --self-test

      - name: Train one epoch and test one response per selected model
        id: loop
        working-directory: Morok
        env:
          G1_TEST_QUESTION: ${{ inputs.question }}
          G1_MODEL_TSUKUYOMI: ${{ inputs.model_tsukuyomi }}
          G1_MODEL_APOLLO: ${{ inputs.model_apollo }}
          G1_MODEL_MOKOSH: ${{ inputs.model_mokosh }}
          G1_MODEL_TSUKUYOMI_MAX: ${{ inputs.model_tsukuyomi_max }}
        run: python3 "Gerações/G1/scripts/run-test-workflow.py"

      - name: Upload model states and test history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morok-g1-teste-state
          path: Morok/test-state/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish test summary
        if: always()
        working-directory: Morok
        run: |
          if [ -f test-state/history.tsv ]; then
            {
              echo "# Teste G1"
              echo
              echo "Uma época e uma tentativa por modelo em cada ciclo. O ciclo termina quando todos os modelos selecionados acertarem."
              echo
              echo '~~~'
              cat test-state/history.tsv
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  continue-until-correct:
    needs: train-and-test
    if: needs.train-and-test.outputs.continue == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Start next cycle with preserved checkpoints
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "teste.yml",
              ref: "main",
              inputs: {
                question: "${{ inputs.question }}",
                model_tsukuyomi: "${{ inputs.model_tsukuyomi }}",
                model_apollo: "${{ inputs.model_apollo }}",
                model_mokosh: "${{ inputs.model_mokosh }}",
                model_tsukuyomi_max: "${{ inputs.model_tsukuyomi_max }}",
                previous_run_id: String(context.runId)
              }
            });
