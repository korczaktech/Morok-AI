name: G1

on:
  push:
    branches: [main]
    paths:
      - "Morok/Gerações/G1/**"
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g1.yml"
  pull_request:
    paths:
      - "Morok/Gerações/G1/**"
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g1-build-test-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configure G1
        working-directory: Morok
        run: >-
          cmake -S . -B build/g1 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Build G1
        working-directory: Morok
        run: cmake --build build/g1 --parallel 2

      - name: Verify installed G1 libraries and headers
        working-directory: Morok
        run: |
          cmake --install build/g1 --prefix build/g1/install
          test -f build/g1/install/include/morok/model/learn/g1_generation.hpp
          test -f build/g1/install/include/morok/g1/mokosh/profile.hpp
          test -f build/g1/install/include/morok/g1/tsukuyomi/profile.hpp
          test -f build/g1/install/include/morok/g1/apollo/profile.hpp
          test -f build/g1/install/lib/libmorok_g1.a
          test -f build/g1/install/lib/libmorok_g1_mokosh.a
          test -f build/g1/install/lib/libmorok_g1_tsukuyomi.a
          test -f build/g1/install/lib/libmorok_g1_apollo.a

      - name: Test G1 and shared core
        working-directory: Morok
        run: ctest --test-dir build/g1 --output-on-failure --parallel 2

      - name: First-training and resume smoke test
        working-directory: Morok
        run: |
          MOROK_TRAIN_BIN=./build/g1/morok-train \
          MOROK_GENERATE_BIN=./build/g1/morok_generate \
            bash Gerações/G1/scripts/first-training.sh artifacts/g1-first-training 2 42

      - name: Evaluate every G1 profile on the same trained checkpoint
        working-directory: Morok
        run: |
          ./build/g1/morok-g1-profile-evaluate \
            artifacts/g1-first-training/g1-best.morokckp \
            artifacts/g1-first-training/profile-evaluation.tsv

      - name: Publish G1 evaluation tables and annotations
        if: always()
        working-directory: Morok
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          results = Path("artifacts/g1-first-training/profile-evaluation.tsv")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          profiles = ("Tsukuyomi", "Apollo", "Mokosh")
          questions = {
              "sky_is_blue": "O céu é azul?",
              "grass_color": "A grama é verde?",
              "mountains_high_or_low": "As montanhas são altas?",
          }

          if not results.is_file():
              message = "Avaliação individual não foi executada; arquivo de resultados ausente."
              print(f"::error title=Avaliação G1::{message}")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("# Avaliação G1\n\n" + message + "\n")
              raise SystemExit(0)

          with results.open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream, delimiter="\t"))

          expected = {(profile, qid) for profile in profiles for qid in questions}
          actual = {(row["profile"], row["question_id"]) for row in rows}
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              print(f"::error title=Avaliação G1::Resultados incompletos. Ausentes: {missing}; extras: {extra}")
              raise SystemExit(1)

          def table(headers, body):
              lines = ["| " + " | ".join(headers) + " |",
                       "| " + " | ".join("---" for _ in headers) + " |"]
              for row in body:
                  cells = [str(cell).replace("|", "\\|").replace("\r", " ").replace("\n", " ") for cell in row]
                  lines.append("| " + " | ".join(cells) + " |")
              return "\n".join(lines) + "\n"

          def display_answer(answer):
              # Preserve the model's exact output without allowing control/private-use
              # Unicode characters to corrupt the Markdown table or terminal rendering.
              if not answer:
                  return "(resposta vazia)"
              escaped = answer.encode("unicode_escape").decode("ascii")
              if len(escaped) > 100:
                  escaped = escaped[:100] + "…"
              return escaped

          for row in rows:
              row["latency_ms"] = float(row["latency_ms"])
              row["correct"] = row["verdict"] == "correct"

          # Table 1: combined question totals across all three profiles.
          overall = []
          for qid, label in questions.items():
              selected = [r for r in rows if r["question_id"] == qid]
              correct = sum(r["correct"] for r in selected)
              incorrect = len(selected) - correct
              state = "Correto" if correct == len(selected) else ("Errado" if correct == 0 else "Parcial")
              overall.append([label, incorrect, correct, state])

          # Table 2: profile-level totals and mean latency.
          individual = []
          for profile in profiles:
              selected = [r for r in rows if r["profile"] == profile]
              correct = sum(r["correct"] for r in selected)
              incorrect = len(selected) - correct
              mean_ms = sum(r["latency_ms"] for r in selected) / len(selected)
              individual.append([profile, correct, incorrect, f"{mean_ms:.3f} ms"])

          # Table 3: each profile's answer to each question.
          detailed = []
          for profile in profiles:
              for qid, label in questions.items():
                  row = next(r for r in rows if r["profile"] == profile and r["question_id"] == qid)
                  answer = display_answer(row["answer"].strip())
                  verdict = "Correto" if row["correct"] else "Errado"
                  detailed.append([profile, label, answer, verdict, f'{row["latency_ms"]:.3f} ms'])

                  # Annotations are individual messages; Markdown tables do not render in annotations.
                  level = "notice" if row["correct"] else "warning"
                  safe = answer.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
                  print(f"::{level} title={profile} - {label}::{verdict}; resposta: {safe}; latência: {row['latency_ms']:.3f} ms")

          report = [
              "# Avaliação G1 — checkpoint treinado nesta execução",
              "",
              "Cada perfil foi avaliado nas mesmas três perguntas usando o checkpoint produzido pelo treinamento desta execução.",
              "",
              "## G1 ao todo — todos os modelos",
              table(["Pergunta", "Respostas Erradas", "Respostas Certas", "Estado"], overall),
              "",
              "## Resultado individual por modelo",
              table(["Modelo", "Corretas", "Incorretas", "Tempo médio"], individual),
              "",
              "## Avaliação individual de cada resposta",
              table(["Modelo", "Pergunta", "Resposta gerada (escapada)", "Estado", "Tempo"], detailed),
          ]
          rendered = "\n".join(report) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(rendered)
          print(rendered)
          PY

      - name: Upload G1 training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morok-g1-training
          path: Morok/artifacts/g1-first-training/
          if-no-files-found: ignore
          retention-days: 14
