name: G1

on:
  push:
    branches: [main]
    paths:
      - "Morok/Gerações/G1/**"
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g1.yml"
  pull_request:
    paths:
      - "Morok/Gerações/G1/**"
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g1-build-test-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configure G1
        working-directory: Morok
        run: >-
          cmake -S . -B build/g1 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Build G1
        working-directory: Morok
        run: cmake --build build/g1 --parallel 2

      - name: Verify installed G1 libraries and headers
        working-directory: Morok
        run: |
          cmake --install build/g1 --prefix build/g1/install
          test -f build/g1/install/include/morok/model/learn/g1_generation.hpp
          test -f build/g1/install/include/morok/g1/mokosh/profile.hpp
          test -f build/g1/install/include/morok/g1/tsukuyomi/profile.hpp
          test -f build/g1/install/include/morok/g1/apollo/profile.hpp
          test -f build/g1/install/lib/libmorok_g1.a
          test -f build/g1/install/lib/libmorok_g1_mokosh.a
          test -f build/g1/install/lib/libmorok_g1_tsukuyomi.a
          test -f build/g1/install/lib/libmorok_g1_apollo.a

      - name: Test G1 and shared core
        working-directory: Morok
        run: ctest --test-dir build/g1 --output-on-failure --parallel 2

      - name: First-training and resume smoke test
        working-directory: Morok
        run: |
          MOROK_TRAIN_BIN=./build/g1/morok-train \
          MOROK_GENERATE_BIN=./build/g1/morok_generate \
            bash Gerações/G1/scripts/first-training.sh artifacts/g1-first-training 2 42

      - name: Publish reinforcement results as GitHub Actions annotations
        if: always()
        working-directory: Morok
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("Gerações/G1/data/reinforcement/answers.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          episodes = data.get("episodes", [])
          labels = {
              "sky_is_blue": "O céu é azul?",
              "grass_color": "Que cor é a grama?",
              "mountains_high_or_low": "As montanhas são baixas ou altas?",
          }
          print("::notice title=Reforço G1::O histórico contém {} episódios, {} demonstrações-oráculo e {} tentativas geradas.".format(
              len(episodes),
              sum(e.get("source") == "oracle_demonstration" for e in episodes),
              sum(e.get("source") == "model_generated" for e in episodes)))
          for qid, label in labels.items():
              selected = [e for e in episodes if e.get("question_id") == qid and e.get("source") == "model_generated"]
              correct = sum(e.get("verdict") == "correct" for e in selected)
              incorrect = sum(e.get("verdict") == "incorrect" for e in selected)
              print("::warning title=Histórico: {}::{} tentativas geradas; {} corretas; {} incorretas. Este histórico não separa os perfis.".format(
                  label, len(selected), correct, incorrect))
          for profile in ("Tsukuyomi", "Mokosh", "Apollo"):
              print("::warning title=Avaliação {}::Resposta e latência individuais ainda não foram medidas nesta execução. Não há resultado por perfil para publicar.".format(profile))
          print("::notice title=Limite da avaliação::O histórico de reforço não contém duração de inferência nem identificador de perfil; não é possível calcular velocidade individual.")
          PY

      - name: Upload G1 training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morok-g1-training
          path: Morok/artifacts/g1-first-training/
          if-no-files-found: ignore
          retention-days: 14
