name: G1

on:
  push:
    branches: [main]
    paths:
      - "Morok/Gerações/G1/**"
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g1.yml"
  pull_request:
    paths:
      - "Morok/Gerações/G1/**"
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g1.yml"
  workflow_dispatch:
    inputs:
      attempts:
        description: "Tentativas por pergunta e por modelo (1–1000)"
        type: number
        required: true
        default: 1
      epochs:
        description: "Épocas de treinamento por modelo (1–1000000)"
        type: number
        required: true
        default: 2
      question_sky:
        description: "O céu é azul?"
        type: boolean
        required: true
        default: true
      question_grass:
        description: "Qual a cor da grama?"
        type: boolean
        required: true
        default: true
      question_mountains:
        description: "As montanhas são altas?"
        type: boolean
        required: true
        default: true
      model_tsukuyomi:
        description: "Executar Tsukuyomi"
        type: boolean
        required: true
        default: true
      model_apollo:
        description: "Executar Apollo"
        type: boolean
        required: true
        default: true
      model_mokosh:
        description: "Executar Mokosh"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: g1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g1-build-test-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configure G1
        working-directory: Morok
        run: >-
          cmake -S . -B build/g1 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Build G1
        working-directory: Morok
        run: cmake --build build/g1 --parallel 2

      - name: Verify installed G1 libraries and headers
        working-directory: Morok
        run: |
          cmake --install build/g1 --prefix build/g1/install
          test -f build/g1/install/include/morok/model/learn/g1_generation.hpp
          test -f build/g1/install/include/morok/g1/mokosh/profile.hpp
          test -f build/g1/install/include/morok/g1/tsukuyomi/profile.hpp
          test -f build/g1/install/include/morok/g1/apollo/profile.hpp
          test -f build/g1/install/lib/libmorok_g1.a
          test -f build/g1/install/lib/libmorok_g1_mokosh.a
          test -f build/g1/install/lib/libmorok_g1_tsukuyomi.a
          test -f build/g1/install/lib/libmorok_g1_apollo.a

      - name: Test G1 and shared core
        working-directory: Morok
        run: ctest --test-dir build/g1 --output-on-failure --parallel 2

      - name: Configured per-model training and repeated question attempts
        working-directory: Morok
        env:
          G1_ATTEMPTS: ${{ inputs.attempts || 1 }}
          G1_EPOCHS: ${{ inputs.epochs || 2 }}
          G1_QUESTION_SKY: ${{ github.event_name != 'workflow_dispatch' || inputs.question_sky }}
          G1_QUESTION_GRASS: ${{ github.event_name != 'workflow_dispatch' || inputs.question_grass }}
          G1_QUESTION_MOUNTAINS: ${{ github.event_name != 'workflow_dispatch' || inputs.question_mountains }}
          G1_MODEL_TSUKUYOMI: ${{ github.event_name != 'workflow_dispatch' || inputs.model_tsukuyomi }}
          G1_MODEL_APOLLO: ${{ github.event_name != 'workflow_dispatch' || inputs.model_apollo }}
          G1_MODEL_MOKOSH: ${{ github.event_name != 'workflow_dispatch' || inputs.model_mokosh }}
        run: python3 Gerações/G1/scripts/run-configured-workflow.py

      - name: Publish G1 evaluation tables and annotations
        if: always()
        working-directory: Morok
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          results = Path("artifacts/g1-first-training/profile-evaluation.tsv")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          questions = {
              "sky_is_blue": "O céu é azul?",
              "grass_color": "Qual a cor da grama?",
              "mountains_high_or_low": "As montanhas são altas?",
          }
          if not results.is_file():
              message = "Nenhuma avaliação foi produzida; verifique a etapa de treinamento."
              print(f"::error title=Avaliação G1::{message}")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("# Avaliação G1\n\n" + message + "\n")
              raise SystemExit(0)

          with results.open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream, delimiter="\t"))
          if not rows:
              raise SystemExit("O arquivo de avaliação está vazio.")
          profiles = list(dict.fromkeys(row["profile"] for row in rows))
          question_ids = list(dict.fromkeys(row["question_id"] for row in rows))
          for row in rows:
              row["latency_ms"] = float(row["latency_ms"])
              row["correct"] = row["verdict"] == "correct"
              row["attempt"] = int(row["attempt"])

          def table(headers, body):
              lines = ["| " + " | ".join(headers) + " |",
                       "| " + " | ".join("---" for _ in headers) + " |"]
              for row in body:
                  cells = [str(cell).replace("|", "\\|").replace("\r", " ").replace("\n", " ") for cell in row]
                  lines.append("| " + " | ".join(cells) + " |")
              return "\n".join(lines) + "\n"

          def display_answer(answer):
              if not answer:
                  return "(resposta vazia)"
              letters = sum(ch.isascii() and ch.isalpha() for ch in answer)
              if letters < 4 or letters / len(answer) < 0.20:
                  return f"(saída não legível; {len(answer)} caracteres)"
              escaped = answer.encode("unicode_escape").decode("ascii")
              return escaped if len(escaped) <= 100 else escaped[:100] + "…"

          overall = []
          for qid in question_ids:
              selected = [r for r in rows if r["question_id"] == qid]
              correct = sum(r["correct"] for r in selected)
              incorrect = len(selected) - correct
              state = "Correto" if incorrect == 0 else ("Errado" if correct == 0 else "Parcial")
              overall.append([questions[qid], incorrect, correct, state])

          individual = []
          for profile in profiles:
              selected = [r for r in rows if r["profile"] == profile]
              correct = sum(r["correct"] for r in selected)
              incorrect = len(selected) - correct
              mean_ms = sum(r["latency_ms"] for r in selected) / len(selected)
              individual.append([profile, correct, incorrect, f"{mean_ms:.3f} ms"])

          # Consolida todas as tentativas por modelo/pergunta.
          # A resposta exibida é a mais frequente; latência e taxa de acerto são médias.
          grouped = {}
          for row in rows:
              grouped.setdefault((row["profile"], row["question_id"]), []).append(row)

          detailed = []
          for (profile, qid), attempts in grouped.items():
              answers = [r["answer"].strip() for r in attempts]
              answer_counts = {}
              for answer in answers:
                  answer_counts[answer] = answer_counts.get(answer, 0) + 1
              representative = max(answer_counts, key=answer_counts.get)
              correct_count = sum(r["correct"] for r in attempts)
              accuracy = correct_count / len(attempts) * 100
              mean_ms = sum(r["latency_ms"] for r in attempts) / len(attempts)
              verdict = "Correto" if accuracy > 50 else ("Errado" if accuracy < 50 else "Empate")
              answer = display_answer(representative)
              detailed.append([profile, questions[qid], answer, verdict,
                               f"{accuracy:.1f}%", f"{mean_ms:.3f} ms"])
              level = "notice" if accuracy > 50 else "warning"
              safe = answer.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
              print(f"::{level} title={profile}::{questions[qid]}; acerto médio: {accuracy:.1f}%; estado: {verdict}; resposta representativa: {safe}; latência média: {mean_ms:.3f} ms")

          report = [
              "# Avaliação G1 — execução configurada", "",
              f"Modelos: {', '.join(profiles)}. Perguntas selecionadas: {len(question_ids)}. Resultados consolidados pela média das tentativas.", "",
              "## G1 ao todo — todos os modelos",
              table(["Pergunta", "Respostas Erradas", "Respostas Certas", "Estado"], overall), "",
              "## Resultado individual por modelo",
              table(["Modelo", "Corretas", "Incorretas", "Tempo médio"], individual), "",
              "## Resultado médio por modelo e pergunta",
              table(["Modelo", "Pergunta", "Resposta representativa", "Estado", "Acerto médio", "Latência média"], detailed)
          ]
          rendered = "\n".join(report) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(rendered)
          print(rendered)
          PY

      - name: Upload G1 training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morok-g1-training
          path: Morok/artifacts/g1-first-training/
          if-no-files-found: ignore
          retention-days: 14
