name: Treinamento — G3

on:
  workflow_dispatch:
    inputs:
      executar_sft:
        description: "Executar somente treinamento supervisionado (SFT)"
        type: boolean
        required: false
        default: false
      executar_rl:
        description: "Executar Reinforcement Learning (RL) independente do SFT"
        type: boolean
        required: false
        default: false
      ciclos:
        description: "Quantidade de ciclos SFT (1 a 100)"
        type: number
        required: true
        default: 1
      epocas_sft:
        description: "Épocas SFT por ciclo"
        type: number
        required: true
        default: 3
      seed:
        description: "Seed fixa do treinamento e da divisão por grupos"
        type: number
        required: true
        default: 42
      epocas_rl:
        description: "Épocas de REINFORCE (1 a 100)"
        type: number
        required: true
        default: 3
      limiar_lexical:
        description: "Percentual mínimo de similaridade lexical para marcar CORRETO"
        type: number
        required: true
        default: 80

permissions:
  contents: read
  actions: read

concurrency:
  group: treinamento-g3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  treinar-g3:
    name: Treinamento G3 — SFT ou RL
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DATASET: Gerações/G3/training/dataset/g3_ptbr_v1.jsonl
      RL_DATASET: Gerações/G3/rl/dataset/g3_rl_ptbr_v1.jsonl
      OUTPUT_DIR: build/g3-training
      EXECUTAR_SFT: ${{ inputs.executar_sft }}
      EXECUTAR_RL: ${{ inputs.executar_rl }}
      CICLOS: ${{ inputs.ciclos }}
      EPOCAS_SFT: ${{ inputs.epocas_sft }}
      SEED: ${{ inputs.seed }}
      EPOCAS_RL: ${{ inputs.epocas_rl }}
      LIMIAR_LEXICAL: ${{ inputs.limiar_lexical }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar seleção e parâmetros
        run: |
          python3 - <<'PY'
          import os
          sft = os.environ["EXECUTAR_SFT"].lower() == "true"
          rl = os.environ["EXECUTAR_RL"].lower() == "true"
          if sft == rl:
              raise SystemExit("Marque exatamente uma opção: SFT ou RL. As duas opções não podem ser executadas juntas.")

          rl_epochs = int(os.environ["EPOCAS_RL"])
          if not 1 <= rl_epochs <= 100:
              raise SystemExit("epocas_rl deve estar entre 1 e 100.")
          lexical_threshold = float(os.environ["LIMIAR_LEXICAL"])
          if not 0.0 <= lexical_threshold <= 100.0:
              raise SystemExit("limiar_lexical deve estar entre 0 e 100.")

          if sft:
              cycles = int(os.environ["CICLOS"])
              epochs = int(os.environ["EPOCAS_SFT"])
              seed = int(os.environ["SEED"])
              if not 1 <= cycles <= 100:
                  raise SystemExit("ciclos deve estar entre 1 e 100.")
              if not 1 <= epochs <= 1000:
                  raise SystemExit("epocas_sft deve estar entre 1 e 1000.")
              if not 0 <= seed <= 18446744073709551615:
                  raise SystemExit("seed-base inválida para a quantidade de ciclos.")
              print(f"Modo selecionado: SFT; {cycles} ciclo(s), {epochs} época(s) por ciclo.")
          else:
              seed = int(os.environ["SEED"])
              if not 0 <= seed <= 18446744073709551615:
                  raise SystemExit("seed inválida.")
              print(f"Modo selecionado: RL independente; inicialização própria, seed {seed}.")
          PY

      - name: Validar corpus pt-BR
        if: ${{ inputs.executar_sft }}
        run: |
          python3 "Morok/Gerações/G3/training/dataset/validate_corpus.py" "Morok/$DATASET"

      - name: Validar dataset independente do RL
        if: ${{ inputs.executar_rl }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("Morok") / Path("Gerações/G3/rl/dataset/g3_rl_ptbr_v1.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          required = {"example_id", "group_id", "category", "question", "answer", "source", "language", "dataset_version"}
          if len(rows) < 3 or any(not required.issubset(row) for row in rows):
              raise SystemExit("Dataset RL vazio, pequeno ou com schema incompleto.")
          if any(row.get("sensitive", False) or float(row.get("quality", 1.0)) < 1.0 for row in rows):
              raise SystemExit("Dataset RL contém exemplo sensível ou pendente de revisão.")
          if len({row["example_id"] for row in rows}) != len(rows):
              raise SystemExit("Dataset RL contém example_id duplicado.")
          if len({row["group_id"] for row in rows}) < 3:
              raise SystemExit("Dataset RL precisa de pelo menos três grupos.")
          print(f"Dataset RL validado: {len(rows)} exemplos revisados.")
          PY
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev libicu-dev

      - name: Configurar projeto
        working-directory: Morok
        run: |
          cmake -S . -B build/g3-training -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOROK_BUILD_TESTS=ON \
            -DMOROK_BUILD_APPS=ON

      - name: Compilar somente os componentes selecionados
        working-directory: Morok
        shell: bash
        run: |
          set -euo pipefail
          targets=()
          if [[ "$EXECUTAR_SFT" == "true" ]]; then
            targets+=(morok_g3_train morok_g3_evaluate morok_g3_analyze morok_test_g3_training)
          fi
          if [[ "$EXECUTAR_RL" == "true" ]]; then
            targets+=(morok_g3_reinforce morok_g3_analyze morok_test_g3_reinforcement)
          fi
          cmake --build build/g3-training --parallel 2 --target "${targets[@]}"

      - name: Executar testes do modo selecionado
        working-directory: Morok
        shell: bash
        run: |
          if [[ "$EXECUTAR_SFT" == "true" ]]; then
            ctest --test-dir build/g3-training -R "g3.training" --output-on-failure
          else
            ctest --test-dir build/g3-training -R "g3.reinforcement" --output-on-failure
          fi

      - name: Executar treinamento supervisionado (SFT)
        if: ${{ inputs.executar_sft }}
        working-directory: Morok
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          summary_file="$OUTPUT_DIR/cycles-summary.tsv"
          printf "cycle\tseed\tstatus\n" > "$summary_file"
          cp "$DATASET" "$OUTPUT_DIR/g3_ptbr_v1.jsonl"
          sha256sum "$OUTPUT_DIR/g3_ptbr_v1.jsonl" > "$OUTPUT_DIR/dataset.sha256"

          # Todos os ciclos pertencem à mesma execução de treinamento:
          # pesos, AdamW, scheduler e RNG são restaurados do checkpoint anterior.
          # A quantidade total de épocas e a seed permanecem constantes para que
          # o fingerprint de configuração do checkpoint continue compatível.
          total_epochs=$((CICLOS * EPOCAS_SFT))
          checkpoint="$OUTPUT_DIR/g3-sft-continuous.g3ckpt"

          for ((cycle=1; cycle<=CICLOS; cycle++)); do
            cycle_name="$(printf '%03d' "$cycle")"
            cycle_dir="$OUTPUT_DIR/cycle-$cycle_name"
            mkdir -p "$cycle_dir"
            echo "::group::SFT — ciclo $cycle/$CICLOS — seed $SEED"

            train_args=(
              "$DATASET"
              "$cycle_dir/sft-metrics.jsonl"
              "$cycle_dir/g3-sft.morok"
              "$total_epochs" "$SEED"
              "--max-epochs-this-run=$EPOCAS_SFT"
            )
            if (( cycle == 1 )); then
              train_args+=("--checkpoint=$checkpoint")
            else
              train_args+=("--resume=$checkpoint" "--checkpoint=$checkpoint")
            fi

            build/g3-training/morok-g3-train "${train_args[@]}"

            build/g3-training/morok-g3-evaluate \
              "$DATASET" \
              "$cycle_dir/g3-sft.morok" \
              "$cycle_dir/sft-evaluation.json" \
              "$SEED"

            echo "Analisando respostas geradas pelo modelo SFT (705 perguntas)..."
            build/g3-training/morok-g3-analyze \
              "$DATASET" \
              "$cycle_dir/g3-sft.morok" \
              "$cycle_dir/answer-analysis.jsonl" \
              "$LIMIAR_LEXICAL"

            printf "%s\t%s\tsuccess\n" "$cycle" "$SEED" >> "$summary_file"
            echo "Ciclo $cycle concluído; épocas acumuladas: $((cycle * EPOCAS_SFT))/$total_epochs."
            echo "::endgroup::"
          done

          {
            echo "## Treinamento supervisionado G3"
            echo "- Ciclos: $CICLOS"
            echo "- Épocas por ciclo: $EPOCAS_SFT"
            echo "- Seed-base: $SEED"
            cat "$summary_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Executar Reinforcement Learning (RL) independente
        if: ${{ inputs.executar_rl }}
        working-directory: Morok
        shell: bash
        run: |
          set -euo pipefail
          rl_dir="$OUTPUT_DIR/rl-output"
          mkdir -p "$rl_dir"

          # A política RL é inicializada do zero com a seed informada.
          # Nenhum artefato, checkpoint ou estado de SFT é baixado ou carregado.
          build/g3-training/morok-g3-reinforce \
            "$RL_DATASET" \
            "$rl_dir/g3-rl.morok" \
            "$rl_dir/rl-report.json" \
            "$EPOCAS_RL" "$SEED"

          echo "Analisando respostas geradas pela política RL (705 perguntas)..."
          build/g3-training/morok-g3-analyze \
            "$RL_DATASET" \
            "$rl_dir/g3-rl.morok" \
            "$rl_dir/answer-analysis.jsonl" \
            "$LIMIAR_LEXICAL"

          {
            echo "## Reinforcement Learning G3 independente"
            echo "- Inicialização: pesos aleatórios próprios"
            echo "- Seed: $SEED"
            echo "- Épocas RL: $EPOCAS_RL"
            cat "$rl_dir/rl-report.json"
            echo "- Análise lexical por pergunta: $rl_dir/answer-analysis.jsonl"
            echo "- Limiar lexical CORRETO: $LIMIAR_LEXICAL%"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Salvar modelos e relatórios SFT
        if: always() && inputs.executar_sft
        uses: actions/upload-artifact@v4
        with:
          name: morok-g3-training-${{ github.run_id }}
          path: |
            Morok/build/g3-training/cycle-*
            Morok/build/g3-training/g3-sft-continuous.g3ckpt
            Morok/build/g3-training/cycles-summary.tsv
            Morok/build/g3-training/g3_ptbr_v1.jsonl
            Morok/build/g3-training/dataset.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Salvar modelo e relatório RL
        if: always() && inputs.executar_rl
        uses: actions/upload-artifact@v4
        with:
          name: morok-g3-rl-${{ github.run_id }}
          path: |
            Morok/build/g3-training/rl-output/*
            Morok/Gerações/G3/rl/dataset/g3_rl_ptbr_v1.jsonl
          if-no-files-found: warn
          retention-days: 30
