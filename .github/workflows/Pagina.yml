name: Pagina

on:
  push:
    branches:
      - Website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: Website

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validar arquivos do frontend
        run: |
          test -s Site/Front-End/index.html
          test -s Site/Front-End/styles.css
          test -s Site/Front-End/app.js

      - name: Validar sintaxe JavaScript
        run: node --check Site/Front-End/app.js

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Site/Front-End

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
