name: Pagina

on:
  push:
    branches:
      - Website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: Website

      - name: Baixar fonte oficial do Tsukuyomi G2
        uses: actions/checkout@v4
        with:
          ref: main
          path: model-source
          persist-credentials: false

      - name: Baixar checkpoints individuais publicados
        uses: actions/checkout@v4
        with:
          ref: tsukuyomi-state
          path: tsukuyomi-state
          persist-credentials: false

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validar arquivos do frontend
        run: |
          test -s Site/Front-End/index.html
          test -s Site/Front-End/styles.css
          test -s Site/Front-End/app.js

      - name: Validar sintaxe JavaScript
        run: |
          node --check Site/Front-End/app.js
          node --check Site/Front-End/sw.js
          node --check Site/Front-End/validate.mjs
          node --check Site/Back-End/server.js
          node -e "JSON.parse(require('node:fs').readFileSync('Site/Back-End/package.json', 'utf8'))"
          cd Site/Back-End
          npm install --ignore-scripts
          npm audit --omit=dev --audit-level=high
          cd ../..
          node Site/Front-End/validate.mjs
      - name: Validar contratos de sincronização
        run: |
          grep -q 'path === "/v1/conversations/delete"' Site/Back-End/server.js
          grep -q "'/v1/conversations/delete'" Site/Front-End/app.js
          grep -q 'conversationDeletions.deleteMany' Site/Back-End/server.js
          grep -q 'state.tasks = merged.slice(0, 100);' Site/Front-End/app.js
          grep -q 'path === "/v1/support/tickets/close"' Site/Back-End/server.js
          grep -q 'data-close-ticket' Site/Front-End/app.js
          grep -q 'async function clearLocalPushSubscription()' Site/Front-End/app.js

      - name: Testar API e preflight CORS
        env:
          API_URL: https://morok-ai.onrender.com
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 35 -fsS "$API_URL/health" -o /tmp/morok-health.json
          grep -q '"status":"ok"' /tmp/morok-health.json
          curl --retry 5 --retry-delay 5 --retry-all-errors --max-time 35 -fsS "$API_URL/v1/push/config" -o /tmp/morok-push.json
          grep -q '"enabled":true' /tmp/morok-push.json
          for origin in https://korczaktech.github.io https://morokai.korczaktech.com.br; do
            for route in /v1/chat /auth/login /v1/push/config /v1/conversations/delete /v1/resources/delete /v1/account/delete /v1/support/tickets /v1/support/tickets/close; do
              headers="$(curl --retry 3 --retry-delay 3 --retry-all-errors --max-time 25 -sS -D - -o /dev/null -X OPTIONS "$API_URL$route" -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization')"
              printf '%s\\n' "$headers" | grep -Fqi "Access-Control-Allow-Origin: $origin"
              printf '%s\\n' "$headers" | grep -Eqi 'Access-Control-Allow-Methods:.*POST'
            done
          done
          for route in /v1/conversations/delete /v1/resources/delete /v1/account/delete /v1/support/tickets /v1/support/tickets/close; do
            status="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' -X POST "$API_URL$route" -H 'Content-Type: application/json' -d '{}')"
            test "$status" = "401"
          done
      - name: Validar e compilar Tsukuyomi G2 para WebAssembly
        run: |
          set -euo pipefail
          CHECKPOINT_DIR="tsukuyomi-state/state/tsukuyomi-g2-questions"
          test -d "$CHECKPOINT_DIR"
          CHECKPOINT_COUNT="$(find "$CHECKPOINT_DIR" -maxdepth 1 -type f -name '*.ckpt' | wc -l)"
          test "$CHECKPOINT_COUNT" -eq 40
          mkdir -p Site/Front-End/wasm
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            emscripten/emsdk:3.1.64 \
            em++ -std=c++20 -O3 -DNDEBUG \
              -I "model-source/Morok/Gerações/G2/Tsukuyomi/include" \
              "model-source/Morok/Gerações/G2/Tsukuyomi/src/model.cpp" \
              "Site/Front-End/wasm/wasm_api.cpp" \
              -o "Site/Front-End/wasm/tsukuyomi.js" \
              --bind -fexceptions \
              -sDISABLE_EXCEPTION_CATCHING=0 \
              -sMODULARIZE=1 \
              -sEXPORT_NAME=createTsukuyomiModule \
              -sENVIRONMENT=web,worker,node \
              -sALLOW_MEMORY_GROWTH=1 \
              -sSTACK_SIZE=2097152 \
              -sFORCE_FILESYSTEM=1 \
              -sEXPORTED_RUNTIME_METHODS=FS
          node --check Site/Front-End/wasm/tsukuyomi.js
          node --check Site/Front-End/wasm/tsukuyomi-g3.js
          test -s Site/Front-End/wasm/tsukuyomi-g3.wasm
          test "$(wc -c < Site/Front-End/wasm/models/g3-tsukuyomi.morok)" -eq 400064


      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Site/Front-End

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
