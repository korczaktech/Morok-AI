name: Pagina

on:
  push:
    branches:
      - Website
    paths:
      - "Site/Front-End/**"
      - ".github/workflows/Pagina.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validar página inicial
        run: test -f Site/Front-End/index.html

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Site/Front-End

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
