name: G2 — Tsukuyomi

on:
  push:
    branches: [main]
    paths:
      - "Morok/Gerações/G2/Tsukuyomi/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g2.yml"
  pull_request:
    paths:
      - "Morok/Gerações/G2/Tsukuyomi/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-tsukuyomi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsukuyomi-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configure
        working-directory: Morok
        run: >-
          cmake -S . -B build/g2 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Build Tsukuyomi G2 v0.1
        working-directory: Morok
        run: >-
          cmake --build build/g2 --parallel 2
          --target morok_g2_tsukuyomi
          morok_g2_tsukuyomi_train
          morok_g2_tsukuyomi_generate
          morok_test_g2_tsukuyomi

      - name: Test Tsukuyomi G2 v0.1
        working-directory: Morok
        run: ctest --test-dir build/g2 -R "g2.tsukuyomi.model|architecture.generation_isolation" --output-on-failure

