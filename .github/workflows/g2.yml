name: G2 — Tsukuyomi

on:
  push:
    branches: [main]
    paths:
      - "Morok/Gerações/G2/Tsukuyomi/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g2.yml"
  pull_request:
    paths:
      - "Morok/Gerações/G2/Tsukuyomi/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/cmake/**"
      - ".github/workflows/g2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-tsukuyomi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsukuyomi-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testar separação de dados e avaliador
        working-directory: Morok
        run: python3 -m unittest discover -s "Gerações/G2/Tsukuyomi/tests" -p "test_*.py" -v

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configure
        working-directory: Morok
        run: >-
          cmake -S . -B build/g2 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Build Tsukuyomi G2 v0.1
        working-directory: Morok
        run: >-
          cmake --build build/g2 --parallel 2
          --target morok_g2_tsukuyomi
          morok_g2_tsukuyomi_train
          morok_g2_tsukuyomi_generate
          morok_test_g2_tsukuyomi

      - name: Test Tsukuyomi G2 v0.1
        working-directory: Morok
        run: ctest --test-dir build/g2 -R "g2.tsukuyomi.model|architecture.generation_isolation" --output-on-failure

      - name: Smoke test de treinamento e inferência
        working-directory: Morok
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("build/g2/tsukuyomi-smoke-corpus.bin").write_bytes(
              ("Morok AI — Tsukuyomi G2 v0.1. " * 12).encode("utf-8"))
          PY
          build/g2/morok-g2-tsukuyomi-train build/g2/tsukuyomi-smoke-corpus.bin build/g2/tsukuyomi-smoke.ckpt 1 42
          build/g2/morok-g2-tsukuyomi-generate build/g2/tsukuyomi-smoke.ckpt "Morok" 32 > build/g2/tsukuyomi-smoke-output.txt
          test -s build/g2/tsukuyomi-smoke.ckpt
          test -s build/g2/tsukuyomi-smoke-output.txt

          # Regressão do parser: BOM, espaços antes dos marcadores e CRLF.
          printf '\357\273\277  U: pergunta\r\n  IA: resposta\r\n' > build/g2/dialogue-parser-smoke.txt
          build/g2/morok-g2-tsukuyomi-train build/g2/dialogue-parser-smoke.txt build/g2/dialogue-parser-smoke.ckpt 1 42 > build/g2/dialogue-parser-smoke.log
          grep -q 'Bytes-alvo: 11' build/g2/dialogue-parser-smoke.log
          build/g2/morok-g2-tsukuyomi-train \
            "Gerações/G2/Tsukuyomi/data/treinamento.txt" \
            build/g2/tsukuyomi-dialogue-smoke.ckpt 1 42 > build/g2/tsukuyomi-dialogue-smoke.log
          grep -F "Objetivo: somente respostas IA:" build/g2/tsukuyomi-dialogue-smoke.log
          grep -E "Bytes-alvo: [1-9][0-9]*" build/g2/tsukuyomi-dialogue-smoke.log
          build/g2/morok-g2-tsukuyomi-generate \
            build/g2/tsukuyomi-dialogue-smoke.ckpt "U: Você tem sentimentos? IA:" 32 \
            > build/g2/tsukuyomi-dialogue-smoke-output.txt
          test -s build/g2/tsukuyomi-dialogue-smoke.ckpt
          test -s build/g2/tsukuyomi-dialogue-smoke-output.txt

