name: G2

on:
  push:
    branches: [main]
    paths:
      - "G2/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/g2.yml"
  pull_request:
    paths:
      - "G2/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/g2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g2-build-test-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev

      - name: Configure G2
        run: >-
          cmake -S . -B build/g2 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_G2=ON
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Build G2
        run: cmake --build build/g2 --parallel 2

      - name: Test G2 and shared core
        run: ctest --test-dir build/g2 --output-on-failure --parallel 2

      - name: First-training and independent expert resume smoke test
        run: |
          MOROK_TRAIN_G2_BIN=./build/g2/morok-train-g2 \
          MOROK_GENERATE_G2_BIN=./build/g2/morok-generate-g2 \
            bash G2/scripts/first-training.sh artifacts/g2-first-training 2 42

      - name: Upload G2 training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morok-g2-training
          path: artifacts/g2-first-training/
          if-no-files-found: ignore
          retention-days: 14
