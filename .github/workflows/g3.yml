name: G3 — shared motor integration

on:
  push:
    branches: [main]
    paths:
      - "Morok/Gerações/G3/**"
      - "Morok/include/morok/model/**"
      - "Morok/include/morok/lang/byte_tokenizer.hpp"
      - "Morok/src/lang/byte_tokenizer.cpp"
      - "Morok/tests/unit/lang/test_byte_tokenizer.cpp"
      - "Morok/tests/unit/model/test_model_session.cpp"
      - "Morok/Gerações/G1/shared/include/morok/model/g1_backend.hpp"
      - "Morok/Gerações/G1/shared/src/model/g1_backend.cpp"
      - "Morok/Gerações/G1/shared/tests/unit/model/test_g1_backend.cpp"
      - "Morok/CMakeLists.txt"
      - "Morok/tests/CMakeLists.txt"
      - "Morok/tests/scripts/test_generation_isolation.py"
      - ".github/workflows/g3.yml"
  pull_request:
    paths:
      - "Morok/Gerações/G3/**"
      - "Morok/include/morok/model/**"
      - "Morok/tests/unit/model/test_model_session.cpp"
      - "Morok/Gerações/G1/shared/include/morok/model/g1_backend.hpp"
      - "Morok/Gerações/G1/shared/src/model/g1_backend.cpp"
      - "Morok/Gerações/G1/shared/tests/unit/model/test_g1_backend.cpp"
      - "Morok/CMakeLists.txt"
      - "Morok/tests/CMakeLists.txt"
      - "Morok/tests/scripts/test_generation_isolation.py"
      - ".github/workflows/g3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-shared-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-backend-contract:
    name: Validate shared Morok backend contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev libicu-dev

      - name: Configure existing Morok motor
        working-directory: Morok
        run: >-
          cmake -S . -B build/g3-contract -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON

      - name: Build shared contract adapters and regression targets
        working-directory: Morok
        run: >-
          cmake --build build/g3-contract --parallel 2
          --target morok_test_g1_backend
          morok_test_model_session
          morok_test_byte_tokenizer
          morok_test_g1_forward
          morok_test_g2_tsukuyomi

      - name: Test backend contract, existing G1 motor, G2 and isolation
        working-directory: Morok
        run: >-
          ctest --test-dir build/g3-contract
          -R "model.g1_backend|model.session|lang.byte_tokenizer|model.g1_forward|g2.tsukuyomi.model|architecture.generation_isolation"
          --output-on-failure

      - name: Verify public contract and architecture documentation
        working-directory: Morok
        run: |
          test -f include/morok/model/model_backend.hpp
          test -f include/morok/model/model_session.hpp
          test -f include/morok/lang/byte_tokenizer.hpp
          test -f src/lang/byte_tokenizer.cpp
          test -f "Gerações/G1/shared/include/morok/model/g1_backend.hpp"
          test -f "Gerações/G3/ARQUITETURA.md"
          test ! -d "Gerações/G3/shared"
          grep -q "ModelBackend" "Gerações/G3/README.md"
          grep -q "Morok::Core" "Gerações/G3/README.md"
