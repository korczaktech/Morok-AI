name: Sanitizers

on:
  push:
    branches: [main]
    paths:
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/Gerações/G1/**"
      - "Morok/Gerações/G3/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/CMakePresets.json"
      - "Morok/cmake/**"
      - ".github/workflows/sanitizers.yml"
  pull_request:
    paths:
      - "Morok/include/**"
      - "Morok/src/**"
      - "Morok/Gerações/G1/**"
      - "Morok/Gerações/G3/**"
      - "Morok/tests/**"
      - "Morok/CMakeLists.txt"
      - "Morok/CMakePresets.json"
      - "Morok/cmake/**"
      - ".github/workflows/sanitizers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: ${{ matrix.compiler }} ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libsqlite3-dev clang

      - name: Configure instrumented build
        working-directory: Morok
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DMOROK_BUILD_TESTS=ON
          -DMOROK_BUILD_APPS=ON
          -DMOROK_ENABLE_ASAN=ON
          -DMOROK_ENABLE_UBSAN=ON

      - name: Build
        working-directory: Morok
        run: cmake --build build/sanitizers --parallel 2

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        working-directory: Morok
        run: ctest --test-dir build/sanitizers --output-on-failure --parallel 2
