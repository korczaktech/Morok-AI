name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: morok-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsqlite3-dev
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMOROK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Install application artifacts
        run: |
          cmake --install build --prefix build/install
          test -x build/install/bin/morok-cli
          test -x build/install/bin/morok-convert
          test -x build/install/bin/morok-train
          test -x build/install/bin/morok-evaluate
          test -x build/install/bin/morok-server
      - name: Application end-to-end smoke test
        if: matrix.compiler == 'g++' && matrix.build_type == 'Release'
        run: |
          ./build/morok-convert tests/fixtures/benchmark build/converted-corpus
          ./build/morok-train build/converted-corpus 1 42 --checkpoint build/server-smoke.morok
          ./build/morok-cli inspect build/server-smoke.morok > build/checkpoint-inspection.json
          ./build/morok-cli generate build/server-smoke.morok tests/fixtures/benchmark/doc-01.txt build/cli-generated.txt 8
          ./build/morok_generate build/server-smoke.morok tests/fixtures/benchmark/doc-01.txt build/offline-generated.txt 8
          ./build/morok-evaluate build/server-smoke.morok build/converted-corpus > build/evaluation.json
          test -s build/cli-generated.txt
          test -s build/offline-generated.txt
          grep -q '"bits_per_byte":' build/evaluation.json
          ./build/morok-server build/server-smoke.morok 18080 build/server-smoke.sqlite > build/server-smoke.log 2>&1 &
          server_pid=$!
          trap 'status=$?; cat build/server-smoke.log; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; exit "$status"' EXIT
          for attempt in $(seq 1 10); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18080/health > build/server-health.json; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat build/server-smoke.log
              exit 1
            fi
            sleep 1
          done
          if ! grep -q '"status":"ok"' build/server-health.json; then
            cat build/server-smoke.log
            exit 1
          fi
          timeout 15 curl --silent --show-error --fail -X POST http://127.0.0.1:18080/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"hello","max_new_bytes":4}' > build/server-response.json
          grep -q '"response":' build/server-response.json
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark smoke test
        if: matrix.compiler == 'g++' && matrix.build_type == 'Release'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p benchmark-smoke
          ./build/morok_benchmark tests/fixtures/benchmark benchmark-smoke/g1.jsonl 1 42 CC0-1.0 "Morok AI generated synthetic fixture" 1
      - name: Upload benchmark smoke report
        if: matrix.compiler == 'g++' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: g1-benchmark-smoke
          path: benchmark-smoke/g1.jsonl
