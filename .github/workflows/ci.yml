name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
            preset: debug
          - compiler: GCC
            cxx: g++
            preset: release
          - compiler: Clang
            cxx: clang++
            preset: debug
          - compiler: Clang
            cxx: clang++
            preset: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang ninja-build libsqlite3-dev

      - name: Configure
        working-directory: Morok
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        working-directory: Morok
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        working-directory: Morok
        run: ctest --preset ${{ matrix.preset }} --parallel 2
