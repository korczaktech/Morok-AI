name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsqlite3-dev
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMOROK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Install application artifacts
        run: |
          cmake --install build --prefix build/install
          test -x build/install/bin/morok-cli
          test -x build/install/bin/morok-convert
          test -x build/install/bin/morok-train
          test -x build/install/bin/morok-evaluate
          test -x build/install/bin/morok-server
      - name: Local server end-to-end smoke test
        if: matrix.compiler == 'g++' && matrix.build_type == 'Release'
        run: |
          ./build/morok-train tests/fixtures/benchmark 1 42 --checkpoint build/server-smoke.morok
          ./build/morok-server build/server-smoke.morok 18080 build/server-smoke.sqlite > build/server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health > build/server-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' build/server-health.json
          curl --silent --show-error --fail -X POST http://127.0.0.1:18080/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"hello","max_new_bytes":4}' > build/server-response.json
          grep -q '"response":' build/server-response.json
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark smoke test
        if: matrix.compiler == 'g++' && matrix.build_type == 'Release'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p benchmark-smoke
          ./build/morok_benchmark tests/fixtures/benchmark benchmark-smoke/g1.jsonl 1 42 CC0-1.0 "Morok AI generated synthetic fixture" 1
      - name: Upload benchmark smoke report
        if: matrix.compiler == 'g++' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: g1-benchmark-smoke
          path: benchmark-smoke/g1.jsonl
