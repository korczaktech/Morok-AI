name: Build Tsukuyomi G3 WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [Website]
    paths:
      - "Site/Front-End/wasm/g3_wasm_api.cpp"
      - "Site/Front-End/app.js"
      - "Site/Front-End/index.html"
      - ".github/workflows/g3-wasm-site.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: g3-wasm-site
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: Website
          fetch-depth: 0

      - name: Checkout G3 source from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: g3-source
          sparse-checkout: |
            Morok/Gerações/G3/neural
            Morok/include/morok/common
            Morok/include/morok/model
            Morok/src/common/error.cpp
          sparse-checkout-cone-mode: false

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Find latest successful G3 training artifact
        id: training
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID="$(gh api "repos/$GH_REPO/actions/runs?branch=main&per_page=100" --jq '[.workflow_runs[] | select(.path==".github/workflows/treinamento-g3.yml" and .conclusion=="success")][0].id')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful G3 training run was found." >&2
            exit 1
          fi
          ARTIFACT_ID="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="morok-g3-training-3" and .expired==false) | .id' | head -n 1)"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "The latest successful G3 training run has no unexpired G3 artifact." >&2
            exit 1
          fi
          echo "Using G3 training run $RUN_ID and artifact $ARTIFACT_ID."
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Download trained G3 weights
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p training-artifact
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/${{ steps.training.outputs.artifact_id }}/zip" \
            -o training-artifact.zip
          unzip -o training-artifact.zip -d training-artifact
          test -s training-artifact/g3-rl.morok
          mkdir -p Site/Front-End/wasm/models
          cp training-artifact/g3-rl.morok Site/Front-End/wasm/models/g3-tsukuyomi.morok

      - name: Compile G3 inference engine to WebAssembly
        run: |
          em++ -std=c++20 -O3 -DNDEBUG --bind \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createTsukuyomiG3Module \
            -sENVIRONMENT=web,worker,node \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFILESYSTEM=0 \
            -sNO_EXIT_RUNTIME=1 \
            -I"g3-source/Morok/include" \
            -I"g3-source/Morok/Gerações/G3/neural/include" \
            "Site/Front-End/wasm/g3_wasm_api.cpp" \
            "g3-source/Morok/Gerações/G3/neural/src/gru_backend.cpp" \
            "g3-source/Morok/src/common/error.cpp" \
            -o "Site/Front-End/wasm/tsukuyomi-g3.js"

      - name: Validate generated assets
        run: |
          node --check Site/Front-End/app.js
          node --check Site/Front-End/wasm/tsukuyomi-g3.js
          test -s Site/Front-End/wasm/tsukuyomi-g3.wasm
          test "$(wc -c < Site/Front-End/wasm/models/g3-tsukuyomi.morok)" -eq 400064
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const factory = require("./Site/Front-End/wasm/tsukuyomi-g3.js");
          (async () => {
            const module = await factory({ locateFile: file => path.join(process.cwd(), "Site/Front-End/wasm", file) });
            const runtime = new module.TsukuyomiG3Runtime();
            const model = fs.readFileSync("Site/Front-End/wasm/models/g3-tsukuyomi.morok");
            const bytes = new Uint8Array(model.buffer, model.byteOffset, model.byteLength);
            if (!runtime.loadModel(bytes)) throw new Error("G3 model artifact rejected by WebAssembly runtime.");
            const answer = runtime.generate("Olá, quem é você?", 64, 0.7, 10, 42);
            if (typeof answer !== "string") throw new Error("G3 generation did not return text.");
            process.stdout.write("G3 local inference smoke test passed; output bytes: " + answer.length + "\n");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Publish assets to Website branch

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Site/Front-End/wasm/tsukuyomi-g3.js Site/Front-End/wasm/tsukuyomi-g3.wasm Site/Front-End/wasm/models/g3-tsukuyomi.morok
          if git diff --cached --quiet; then
            echo "Generated G3 browser assets are already current."
            exit 0
          fi
          git commit -m "Build local Tsukuyomi G3 WebAssembly runtime"
          git push origin HEAD:Website
