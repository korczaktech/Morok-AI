name: reinforcement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reinforcement.yml"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "tests/scripts/test_g1_reinforcement.py"
      - "apps/reinforce_g1.cpp"
      - "scripts/run-g1-reinforcement.py"
      - "docs/54-aprendizado-por-reforco-g1.md"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: morok-g1-reinforcement
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  three-question-reinforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous reinforcement model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/reinforcement
          previous_run="$(gh run list \
            --workflow reinforcement.yml \
            --branch main \
            --status success \
            --json databaseId \
            --limit 1 \
            --jq '.[0].databaseId // empty')"
          if [[ -n "$previous_run" ]]; then
            echo "Restoring model from successful reinforcement run $previous_run"
            if ! gh run download "$previous_run" \
              --name morok-g1-reinforcement-state \
              --dir artifacts/reinforcement; then
              echo "::warning::Previous run had no downloadable model artifact; bootstrap will run."
              rm -f artifacts/reinforcement/*
            fi
          else
            echo "No previous reinforcement model; the runner will bootstrap G1."
          fi

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev python3

      - name: Configure Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMOROK_BUILD_TESTS=ON -DMOROK_BUILD_APPS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate, grade and reinforce the three answers
        run: |
          python3 scripts/run-g1-reinforcement.py \
            --checkpoint artifacts/reinforcement/model.morokckp \
            --database data/reinforcement/answers.json \
            --trainer build/morok-train \
            --generator build/morok_generate \
            --reinforcer build/morok-reinforce \
            --bootstrap-epochs 8 \
            --learning-rate 0.0001

      - name: Commit answer and reward history to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reinforcement/answers.json
          if git diff --cached --quiet; then
            echo "No reinforcement database changes to commit."
          else
            git commit -m "Record G1 reinforcement answers and rewards"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publish resumable reinforcement model
        uses: actions/upload-artifact@v4
        with:
          name: morok-g1-reinforcement-state
          path: artifacts/reinforcement/
          if-no-files-found: error
          retention-days: 90
